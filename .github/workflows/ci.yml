name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      VIMKIT_PERF_SCALE: "5"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    name: iOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pick an iPad simulator
        run: |
          id=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPad"))][0].udid')
          test -n "$id" && test "$id" != null
          echo "SIM=$id" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep "$id"
      - name: Test
        run: |
          xcodebuild test -scheme VimKit-Package \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath .build/xcode \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            -quiet
      - name: Build the iOS demo
        working-directory: Demo/VimKitDemo.swiftpm
        run: |
          xcodebuild build -scheme VimKitDemo \
            -destination "platform=iOS Simulator,id=$SIM" \
            -derivedDataPath ../../.build/demo-ios \
            -quiet
